# 打 v* 标签时在 GitHub 的 macOS runner 上跑测试并验证能打出 ccenv.app。
# 正式发布的 dmg 需要 Developer ID 签名 + 公证，在本地用 build.sh 产出后上传（见 README）；
# CI 只在手动触发时才把 ad-hoc 签名的产物挂到 Release，避免覆盖公证过的包。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传到的标签，如 v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: npm test
      - name: Swift tests
        run: swift test
        working-directory: macos
      - name: Build app, dmg, zip
        run: macos/build.sh --dmg --zip
      - name: Upload to release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            macos/dist/ccenv-*.dmg
            macos/dist/ccenv-*-macos.zip
          generate_release_notes: true
