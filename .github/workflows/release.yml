# 打 v* 标签时在 GitHub 的 macOS runner 上构建 ccenv.app，产出 dmg / zip 并附到 Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传到的标签，如 v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: npm test
      - name: Swift tests
        run: swift test
        working-directory: macos
      - name: Build app, dmg, zip
        run: macos/build.sh --dmg --zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            macos/dist/ccenv-*.dmg
            macos/dist/ccenv-*-macos.zip
          generate_release_notes: true
